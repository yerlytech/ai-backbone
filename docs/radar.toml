# What the scheduled agent reads every third day, and how far it has read
# (.ai-backbone/routine.md, the radar section; spec 012, spec 021). `just radar` reads,
# `just radar-mark <name>` moves one marker, `just radar-save` commits this file
# and the run's log line and refuses anything else.
#
# Every address is a file on raw.githubusercontent.com: a cloud sandbox cannot
# ask another repository's API (403, by design) and can read its files
# (measured 2026-09-19). Changelogs, release notes and specifications only.
# Never a skill, a prompt or a command template: text written to instruct an
# agent is the one thing an agent with a push right should not be handed.
#
# bytes    how much of the top of the file one read takes; a week of it, and some
# heading  what a version heading looks like there
# filter   the lines worth showing; skip takes lines back out
# seen     the newest heading at the last read: reading stops there
# hash     for a file with no versions: only "same" or "changed" is ever said
# touches  the backbone files such news would touch; an idea names one of them

[[source]]
name = "claude-code"
url = "https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md"
bytes = 150000
heading = "^## [0-9]"
filter = "AGENTS\\.md|CLAUDE\\.md|SKILL\\.md|\\.claude/(skills|rules|settings)|settings\\.json|SessionStart|^- (\\[[^]]*\\] )?(Added|Changed|Removed|Deprecated) .*(routine|scheduled|claude -p|--permission-mode|headless)"
skip = "^- \\[(VSCode|JetBrains|Claude Tag|Desktop|Chrome)"
seen = "## 2.1.278"
read = "2026-09-19"
touches = "CLAUDE.md, .claude/settings.json, .agents/skills/, .ai-backbone/routine.md, sync-rules in core.just"

