# What this backbone is built on, and what to read when it moves.
# `just upstream` says what has been released since each pin. Neither upgrades
# anything. The pin on each row is the version this file holds, not the newest.

[[watch]]
name = "just"
source = "pypi:rust-just"
pin = "1.59.0"
why = "every repeatable command in every project built on this is a recipe"
check = "recipe syntax, [group] attributes, whether --list output changed, and whether the floor setup.sh names (1.29.0) is still the oldest just that reads core.just"

[[watch]]
name = "prek"
source = "pypi:prek"
pin = "0.5.7"
why = "runs the git hooks: lint before a commit, and the secret scanner"
check = "whether .pre-commit-config.yaml is still read the same way"

[[watch]]
name = "gitleaks"
source = "github:gitleaks/gitleaks"
pin = "v8.30.1"
pinned_in = ".pre-commit-config.yaml"
why = "the one hook worth a download: no secret reaches a commit"
check = "new rules that would make an existing project's commit fail"

[[watch]]
name = "graphify"
source = "pypi:graphifyy"
pin = "0.9.93"
why = "the code map an agent reads instead of the whole codebase"
check = "whether the query commands or the output folder changed"

[[watch]]
name = "uv"
source = "pypi:uv"
pin = "0.13.4"
why = "installs just, prek and graphify, and finds the Python the helpers run on"
check = "whether `uv tool install`, `uv tool upgrade` and `uv python find` still answer the way setup.sh and _py read them"

[[watch]]
name = "cargo-audit"
source = "crates:cargo-audit"
pin = "0.23.0"
why = "RustSec's own reader for Cargo.lock. just doctor runs it instead of the backbone's reader (n-2ed2cf). The owner chose 0.23.0 on 2026-11-11"
check = "whether --json still gives advisory.id, versions.patched and warnings, and whether an ignore entry is still an id and a reason"

[[watch]]
name = "actions/checkout"
source = "github:actions/checkout"
pin = "v7"
major = true
pinned_in = ".github/workflows/checks.yml"
why = "the first step of every job of the gate, and of the workflow ci-init writes into a project"
check = "what the new major drops or changes (fetch-depth, credentials, the Node it runs on); the workflows are carried when Linux and macOS are green"

[[watch]]
name = "grok"
source = "pointer:https://x.ai/cli/stable"
pin = "1.0.62"
why = "the worker CLI a delegated job is handed to"
check = "what a headless run accepts, and whether the binary still answers `grok version`"

[[watch]]
name = "claude-code"
source = "pointer:https://downloads.claude.ai/claude-code-releases/stable"
pin = "2.1.304"
why = "the other worker, and the session that reads these rules"
check = "`claude doctor` says the installed version and `Auto-update channel`; point this at that channel, then read what SessionStart and the skills changed"

[[watch]]
name = "opencode"
source = "brew:opencode"
pin = "2.1.2"
why = "the worker CLI a delegated job is handed to, when WORKER is opencode"
check = "what a headless run accepts, and whether the binary still answers `opencode --version`"

[[watch]]
name = "kimi"
source = "brew:kimi-code"
pin = "2.4.0"
why = "the worker CLI a delegated job is handed to, when WORKER is kimi"
check = "what a headless run accepts, and whether the binary still answers `kimi --version`"
