# Git hooks, managed by prek (a single-binary, Rust rewrite of pre-commit).
#   install:  just hooks-install
#   run now:  prek run --all-files
#   update:   just tools-update
#
# The backbone copies this file once (just new-project, just adopt); after
# that it is yours. Your linter and formatter belong in the `lint` recipe of
# `stack.just`; the last hook below runs it before every commit, so there is
# nothing to repeat here. `just tools-update` bumps the gitleaks version.

# .archive/ holds retired work on purpose: git bundles, tarballs, old documents.
# It is binary, it is large, and it is written exactly once. No hook may read or
# rewrite it. A whitespace fixer appending a newline to a git bundle is how an
# archive quietly rots.
#
# Third-party material and anything private does NOT go here. It goes to brain/,
# which is never committed at all.
exclude: '^\.archive/'

repos:
  # Secret scanning. The one hook that is worth a download. It lets the key
  # Amazon prints in its own documentation (AKIA...EXAMPLE) through on purpose,
  # by the scanner's own allowlist, and stops a key of the real shape: test it
  # with one of those. (No version number in a comment here: the watch list
  # looks for its pin anywhere in this file.)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Built into prek: no clone, no network, no version to fall behind.
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-yaml
      - id: check-toml
      # Two kinds of .json are not JSON: TypeScript allows comments and trailing
      # commas in tsconfig, and VS Code writes comments into every file it keeps
      # in .vscode/ (its own extensions.json starts with two of them), so a save
      # was refused for a file the editor had made.
      - id: check-json
        exclude: '(^|/)(tsconfig[^/]*\.json|\.vscode/[^/]+\.json)$'

  # The logic of the two checks below lives in .ai-backbone/core.just, one place.
  - repo: local
    hooks:
      - id: no-brain
        name: brain/ must never be committed
        entry: bash -c 'if git diff --cached --name-only | grep -q "^brain/"; then echo "brain/ files are staged. Unstage them before committing."; exit 1; fi'
        language: system
        pass_filenames: false

      - id: rules-in-sync
        name: rule copies and skill copies match AGENTS.md
        entry: just _rules-check
        language: system
        pass_filenames: false
        files: '^(AGENTS\.md|\.github/copilot-instructions\.md|\.junie/guidelines\.md|\.agents/skills/.*|\.claude/skills/.*|\.ai-backbone/core\.just)$'

      - id: commit-message
        name: commit message is English and starts with its kind (feat, fix, docs, chore...)
        entry: just _commit-msg-check
        language: system
        stages: [commit-msg]

  # Every test before anything reaches GitHub, for a project whose checks do not
  # run there (Actions off, or no CI yet): this machine is then the only place
  # they run. Uncomment the nine lines below (take away "# " and nothing else),
  # then `just hooks-install`, which installs the push stage whenever this file
  # has one. It runs before every push, and with publish-on-save on that is
  # every save, so it suits a `just test` of seconds. A red run stops the push;
  # the commit stays on this machine. Until a language layer gives the project
  # a test recipe, it runs nothing and lets the push through.
  # - repo: local
  #   hooks:
  #     - id: tests
  #       name: just test
  #       entry: just _test-if-any
  #       language: system
  #       pass_filenames: false
  #       always_run: true
  #       stages: [pre-push]
